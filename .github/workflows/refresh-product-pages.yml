# Rebuilds the product pages, homepage cards, sitemap.xml and llms.txt from the
# live store once a week, so search engines and AI tools see current prices,
# stock and products. Customers already get live data in the browser.
# Run it by hand after big catalogue changes: Actions > Refresh product pages > Run workflow.
name: Refresh product pages

on:
  schedule:
    - cron: '30 21 * * 0' # Mondays 03:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-product-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Leaves the committed pages untouched if the API can't be reached
      - name: Build pages from the live store
        run: node scripts/generate-products.js

      - name: Commit if the catalogue changed
        run: |
          # sitemap.xml gets today's date on every run; ignore it unless something else changed
          if git diff --quiet -- . ':(exclude)sitemap.xml'; then
            git checkout -- sitemap.xml
            echo "Catalogue unchanged, nothing to publish."
            exit 0
          fi
          git config user.name "mantraaq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A products index.html sitemap.xml llms.txt scripts/catalog-snapshot.json
          git commit -m "Refresh product pages from the live store"
          git push
