<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Mantraaq</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Fraunces:opsz,wght@9..144,400..600&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#f3ecdb">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
  <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
  <style>
    :root {
      --ivory: #f3ecdb;
      --paper: #fbf7ee;
      --paper-art: #f4ead2;
      --sand: #ebdfc4;
      --ink: #241316;
      --ink-2: #57474a;
      --ink-3: #8a7b7d;
      --maroon: #6c1121;
      --maroon-2: #830e1e;
      --maroon-deep: #3a0a13;
      --leaf: #2f4429;
      --gold: #c49a4f;
      --line: rgba(36, 19, 22, 0.13);
      --line-2: rgba(36, 19, 22, 0.07);
      --danger: #a3202f;
      --font-display: 'Fraunces', Georgia, serif;
      --font-brand: 'Cinzel', Georgia, serif;
      --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --shadow: 0 2px 6px rgba(58, 10, 19, 0.05), 0 30px 70px -30px rgba(58, 10, 19, 0.35);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--ivory);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 88px 16px 40px;
      -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(60% 50% at 50% 30%, rgba(255, 255, 255, .6), transparent 70%);
    }

    /* Mithila flower band across the top, as on the storefront */
    body::before {
      content: '';
      position: fixed;
      left: 0; right: 0; top: 0;
      height: 44px;
      background: var(--paper-art) url(/assets/images/art/band-flower.webp) repeat-x 0 50% / 62px 100%;
      border-bottom: 3px solid var(--maroon);
      z-index: 0;
    }

    ::selection { background: var(--maroon); color: var(--ivory); }
    :focus-visible { outline: 2px solid var(--leaf); outline-offset: 3px; }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      color: var(--maroon-2);
      text-decoration: none;
    }
    .brand img { width: 40px; height: 40px; object-fit: contain; }
    .brand span { font-family: var(--font-brand); font-weight: 700; font-size: 24px; letter-spacing: 0.02em; }

    h1 {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: clamp(28px, 6vw, 34px);
      line-height: 1.12;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 10px;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      padding: 44px 36px 36px;
      border-radius: 30px;
      background: var(--paper);
      border: 1px solid var(--line-2);
      box-shadow: var(--shadow);
      text-align: center;
    }

    p.subtitle {
      font-size: 15px;
      color: var(--ink-2);
      line-height: 1.6;
      margin-bottom: 30px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
      text-align: left;
    }

    .form-grp { display: flex; flex-direction: column; gap: 8px; }

    .form-grp label {
      font-size: 12px;
      font-weight: 800;
      color: var(--ink-2);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .form-grp input {
      width: 100%;
      min-height: 52px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--ivory);
      font-family: inherit;
      font-size: 16px;
      color: var(--ink);
      outline: none;
      transition: border-color .25s, background .25s, box-shadow .25s;
    }

    .form-grp input:focus {
      border-color: var(--maroon);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(108, 17, 33, 0.08);
    }

    .submit-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      padding: 0 26px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: var(--maroon);
      color: var(--ivory);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-decoration: none;
      cursor: pointer;
      transition: background .3s, transform .3s var(--ease), box-shadow .3s var(--ease);
      margin-top: 6px;
    }

    .submit-btn:hover { background: var(--leaf); box-shadow: 0 14px 30px -12px rgba(47, 68, 41, .55); }
    .submit-btn:active { transform: scale(.98); }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
      background: var(--maroon);
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 26px;
      font-size: 14px;
      font-weight: 700;
      color: var(--maroon);
      text-decoration: none;
      border-bottom: 1px solid rgba(108, 17, 33, .3);
      padding-bottom: 2px;
      transition: color .2s, border-color .2s;
    }

    .back-home:hover { color: var(--leaf); border-color: currentColor; }

    .error-card {
      display: none;
      padding: 14px 16px;
      background: rgba(163, 32, 47, 0.08);
      border: 1px solid rgba(163, 32, 47, 0.2);
      color: var(--danger);
      border-radius: 14px;
      font-size: 14px;
      margin-bottom: 24px;
      text-align: center;
      font-weight: 600;
    }

    @media (max-width: 420px) {
      .container { padding: 36px 22px 28px; border-radius: 24px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <a class="brand" href="index.html" aria-label="MantraAQ home">
      <img src="/assets/images/brand/logo-maroon-128.webp" alt="" width="40" height="40">
      <span>MantraAQ</span>
    </a>

    <div id="errorCard" class="error-card"></div>

    <div id="formContainer">
      <h1>Choose New Password</h1>
      <p class="subtitle">Enter a secure new password for your account below.</p>

      <form id="resetForm" onsubmit="handleResetSubmit(event)">
        <div class="form-grp">
          <label>New Password (Min 6 Characters)</label>
          <input type="password" id="newPassword" placeholder="••••••••" minlength="6" required />
        </div>
        <div class="form-grp">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="••••••••" minlength="6" required />
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">Reset Password</button>
      </form>
    </div>

    <a href="index.html" class="back-home">&larr; Return to Storefront</a>
  </div>

  <!-- Load dependencies (api.js & toast.js) -->
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script>
    let token = null;

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      token = params.get('token');

      if (!token) {
        showError('Invalid reset link. The security token is missing.');
        document.getElementById('formContainer').style.display = 'none';
      }
    });

    function showError(msg) {
      const card = document.getElementById('errorCard');
      card.textContent = msg;
      card.style.display = 'block';
    }

    async function handleResetSubmit(e) {
      e.preventDefault();
      
      const password = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('submitBtn');

      if (password !== confirmPass) {
        window.Toast.error('Passwords do not match.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';

      try {
        const data = await window.MantraaqAPI.resetPassword({ token, password });
        if (data && data.success) {
          window.Toast.success('Password reset successfully! Redirecting to home page...');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 3000);
        } else {
          window.Toast.error(data.message || 'Failed to reset password.');
          btn.disabled = false;
          btn.textContent = 'Reset Password';
        }
      } catch (err) {
        console.error('Reset password submit error:', err);
        window.Toast.error(err.message || 'The reset token may have expired or is invalid.');
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    }
  </script>
</body>
</html>
